name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: task_manager
          MYSQL_USER: taskmanager
          MYSQL_PASSWORD: taskmanager
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/task_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: taskmanager
      DB_PASSWORD: taskmanager
      JWT_SECRET: test-secret-key-that-is-at-least-32-characters-long
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Build backend
        run: mvn -B package -DskipTests


  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  docker:
    name: Docker images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - backend-test
      - frontend-build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -t task-manager-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t task-manager-frontend:${{ github.sha }} \
            ./frontend

      - name: Show Docker images
        run: docker images